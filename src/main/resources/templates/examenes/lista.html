<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Exámenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .table thead th {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border: 1px solid black;
        }
        .table td,
        .table th {
            border: 1px solid black;
        }
        .btn-primary-style {
            background-color: #0d6efd;
            color: white;
            border: 2px solid black;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0.35rem 0.6rem;
        }
        .btn-primary-style:hover {
            background-color: #0b5ed7;
            border-color: black;
        }
        .btn-outline-style {
            color: #0d6efd;
            background-color: white;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-outline-style:hover {
            background-color: #f0f0f0;
        }
        .estado-texto {
            font-weight: bold;
        }
        .estado-aprobado {
            color: #0d6efd;
        }
        .estado-reprobado {
            color: #666;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Exámenes</h2>
        <a href="/coordinador/panel" class="btn btn-outline-style">⬅ Volver al Panel</a>
    </div>

    <div class="mb-3">
        <a href="/coordinador/examenes/nuevo" class="btn btn-primary-style">➕ Nuevo Examen</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombres</th>
                        <th>Documento</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Puntaje Total</th>
                        <th>Estado Examen</th>
                        <th>Acciones</th>
                        <th>Informes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${examenes}">
                        <td th:text="${e.id}"></td>
                        <td th:text="${e.usuario.pnomb} + ' ' + ${e.usuario.papellido}"></td>
                        <td th:text="${e.usuario.numdoc}"></td>
                        <td th:text="${e.usuario.correo}"></td>
                        <td th:text="${e.usuario.telefono}"></td>
                        <td th:text="${e.total}"></td>

                        <!-- Estado sin colores, solo texto diferenciado -->
                        <td>
                            <span class="estado-texto" th:classappend="${e.total >= 150} ? 'estado-aprobado' : 'estado-reprobado'"
                                  th:text="${e.total >= 150} ? 'APROBADO' : 'REPROBADO'">
                            </span>
                        </td>

                        <!-- Acciones: Editar y Eliminar -->
                        <td>
                            <a class="btn btn-primary-style btn-sm"
                               th:href="@{'/coordinador/examenes/editar/' + ${e.id}}">Editar</a>
                            <a class="btn btn-primary-style btn-sm"
                               th:href="@{'/coordinador/examenes/eliminar/' + ${e.id}}"
                               onclick="return confirm('¿Estás seguro de eliminar este examen?');">Eliminar</a>
                        </td>

                        <!-- Informes -->
                        <td>
                            <a class="btn btn-primary-style btn-sm"
                               th:href="@{'/coordinador/examenes/informe-unico/' + ${e.id}}">Único</a>
                            <a class="btn btn-primary-style btn-sm"
                               th:href="@{'/coordinador/examenes/informe-detallado/' + ${e.id}}">Detallado</a>
                            <a class="btn btn-primary-style btn-sm"
                               th:href="@{'/coordinador/examenes/informe-beneficios/' + ${e.id}}">Beneficios</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
