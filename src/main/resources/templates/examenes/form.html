<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Examen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .form-label, .form-check-label {
            font-weight: bold;
            color: #333;
        }
        .btn-primary-style {
            background-color: #0d6efd;
            color: white;
            border: 2px solid black;
            font-weight: bold;
            padding: 0.6rem;
        }
        .btn-primary-style:hover {
            background-color: #0b5ed7;
            border-color: black;
        }
        .btn-outline-style {
            color: #0d6efd;
            background-color: white;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-outline-style:hover {
            background-color: #f0f0f0;
        }
        .card h2 {
            font-weight: bold;
        }
        .form-select, .form-control {
            border: 1px solid #ced4da;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card p-4">

        <h2 class="text-center mb-4" th:text="${examen.id == null} ? 'Nuevo Examen' : 'Editar Examen'"></h2>

        <form action="/coordinador/examenes/guardar" method="post" th:object="${examen}">
            <input type="hidden" th:field="*{id}" />

            <!-- Alumno -->
            <div class="mb-3">
                <label class="form-label">Alumno</label>
                <select class="form-select" th:field="*{usuario.id}" required>
                    <option th:each="u : ${alumnosSinExamen}"
                            th:value="${u.id}"
                            th:text="${u.pnomb} + ' ' + ${u.snomb} + ' ' + ${u.papellido} + ' ' + ${u.sapellido}">
                    </option>
                </select>
            </div>

            <!-- Total -->
            <div class="mb-3">
                <label class="form-label">Total</label>
                <input type="number" class="form-control" th:field="*{total}" required>
            </div>

            <!-- Comunica -->
            <div class="mb-3">
                <label class="form-label">Comunica</label>
                <input type="number" class="form-control" th:field="*{comunica}">
            </div>

            <!-- RazCuant -->
            <div class="mb-3">
                <label class="form-label">RazCuant</label>
                <input type="number" class="form-control" th:field="*{razcuant}">
            </div>

            <!-- LectCrit -->
            <div class="mb-3">
                <label class="form-label">LectCrit</label>
                <input type="number" class="form-control" th:field="*{lectcrit}">
            </div>

            <!-- CompCiud -->
            <div class="mb-3">
                <label class="form-label">CompCiud</label>
                <input type="number" class="form-control" th:field="*{compciud}">
            </div>

            <!-- Inglés -->
            <div class="mb-3">
                <label class="form-label">Inglés</label>
                <input type="number" class="form-control" th:field="*{ingles}">
            </div>

            <!-- ProyIngen -->
            <div class="mb-3">
                <label class="form-label">ProyIngen</label>
                <input type="number" class="form-control" th:field="*{proyingen}">
            </div>

            <!-- P. Científico -->
            <div class="mb-3">
                <label class="form-label">P. Científico</label>
                <input type="number" class="form-control" th:field="*{pcientifico}">
            </div>

            <!-- Diseño Soft -->
            <div class="mb-3">
                <label class="form-label">Diseño Soft</label>
                <input type="number" class="form-control" th:field="*{disensoft}">
            </div>

            <!-- Escala Inglés -->
            <div class="mb-3">
                <label class="form-label">Escala Inglés</label>
                <input type="text" class="form-control" th:field="*{escalaingles}">
            </div>

            <!-- Anulado -->
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" th:field="*{anulado}" id="anuladoCheck">
                <label class="form-check-label" for="anuladoCheck">Anulado</label>
            </div>

            <!-- BOTÓN GUARDAR -->
            <button type="submit" class="btn btn-primary-style w-100">Guardar</button>
        </form>

        <!-- VOLVER -->
        <div class="mt-3 text-center">
            <a href="/coordinador/examenes" class="btn btn-outline-style">⬅ Volver al listado</a>
        </div>

    </div>
</div>

</body>
</html>
