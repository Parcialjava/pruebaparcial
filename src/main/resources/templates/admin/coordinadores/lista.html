<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coordinadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #0d6efd;
            border: 2px solid black;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border: 1px solid black;
        }
        .table td,
        .table th {
            border: 1px solid black;
        }
        /* Botones AZUL con borde negro */
        .btn-primary-style {
            background-color: #0d6efd;
            color: white;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-primary-style:hover {
            background-color: #0b5ed7;
            border-color: black;
        }
        .btn-outline-light {
            color: white;
            border: 2px solid white;
        }
        .btn-outline-light:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        .btn-light.text-primary {
            background-color: white;
            color: #0d6efd;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-light.text-primary:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Lista de Coordinadores</span>
        <div class="d-flex gap-2">
            <a href="/admin/panel" class="btn btn-outline-light">Volver</a>
            <a href="/admin/coordinadores/nuevo" class="btn btn-light text-primary">➕ Nuevo</a>
        </div>
    </div>
</nav>

<!-- CONTENEDOR -->
<div class="container mt-4 mb-4">
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Documento</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${coordinadores}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.numdoc}"></td>
                            <td th:text="${c.pnomb} + ' ' + ${c.papellido}"></td>
                            <td th:text="${c.correo}"></td>
                            <td class="text-center">
                                <a th:href="@{'/admin/coordinadores/editar/' + ${c.id}}"
                                   class="btn btn-primary-style btn-sm">Editar</a>
                                <a th:href="@{'/admin/coordinadores/eliminar/' + ${c.id}}"
                                   class="btn btn-primary-style btn-sm"
                                   onclick="return confirm('¿Eliminar coordinador?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
