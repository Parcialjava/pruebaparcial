<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #0d6efd;
            border: 2px solid black;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .option-btn {
            display: block;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
            transition: none;
            font-weight: bold;
        }
        .option-btn:hover {
            background-color: #e9f0ff;
            text-decoration: none;
        }
        .icon-placeholder {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background-color: #0d6efd;
            border: 2px solid black;
        }
        .option-btn h5 {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .option-btn p {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0;
        }
        .alert {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR SUPERIOR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">Panel del Alumno</span>
        <div class="d-flex">
            <a href="/logout" class="btn btn-outline-light">Cerrar sesión</a>
        </div>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-5 mb-5">
    <div class="card p-4">

        <h2 class="text-center mb-2 fw-bold">
            Bienvenido, <span th:text="${alumno.pnomb}"></span>
        </h2>
        <p class="text-center text-muted mb-4">
            Aquí puedes consultar tus informes Saber Pro.
        </p>

        <!-- SI EL ALUMNO TIENE EXAMEN -->
        <div th:if="${examen != null}">
            <div class="row g-4">

                <!-- Informe Único -->
                <div class="col-md-4">
                    <a href="/alumno/informe-unico" class="option-btn">
                        <div class="icon-placeholder"></div>
                        <h5>Informe Único</h5>
                        <p>Resumen general de tu resultado</p>
                    </a>
                </div>

                <!-- Informe Detallado -->
                <div class="col-md-4">
                    <a href="/alumno/informe-detallado" class="option-btn">
                        <div class="icon-placeholder"></div>
                        <h5>Informe Detallado</h5>
                        <p>Resultado por competencias</p>
                    </a>
                </div>

                <!-- Beneficios -->
                <div class="col-md-4">
                    <a href="/alumno/informe-beneficios" class="option-btn">
                        <div class="icon-placeholder"></div>
                        <h5>Beneficios</h5>
                        <p>Posibles reconocimientos y apoyos</p>
                    </a>
                </div>

            </div>
        </div>

        <!-- SI EL ALUMNO NO TIENE EXAMEN -->
        <div th:if="${examen == null}" class="text-center mt-4">
            <div class="alert">
                No tienes examen registrado aún.
            </div>
        </div>

    </div>
</div>

</body>
</html>
