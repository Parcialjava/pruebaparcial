<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Único</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .info-card {
            border-radius: 20px;
            padding: 30px;
            transition: 0.2s;
        }
        .info-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.15);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            margin: 0 auto 20px auto;
        }
    </style>
</head>

<body class="bg-light">

<!-- NAVBAR SUPERIOR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">Informe Único</span>

        <div class="d-flex">
            <a href="/logout" class="btn btn-outline-light">Cerrar sesión</a>
        </div>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-5">

    <div class="card info-card shadow-lg">
        
        <div class="icon-circle">📄</div>

        <h2 class="text-center fw-bold mb-4">Informe Único</h2>

        <!-- NOMBRE COMPLETO -->
        <p class="fs-5 text-center">
            <strong>Estudiante:</strong>
            <span th:text="${alumno.pnomb} + ' ' + ${alumno.snomb} + ' ' + ${alumno.papellido} + ' ' + ${alumno.sapellido}"></span>
        </p>

        <!-- DOCUMENTO -->
        <p class="fs-5 text-center">
            <strong>Documento:</strong>
            <span th:text="${alumno.numdoc}"></span>
        </p>

        <!-- TELÉFONO -->
        <p class="fs-5 text-center">
            <strong>Teléfono:</strong>
            <span th:text="${alumno.telefono}"></span>
        </p>

        <!-- CORREO -->
        <p class="fs-5 text-center">
            <strong>Correo:</strong>
            <span th:text="${alumno.correo}"></span>
        </p>

        <!-- PUNTAJE -->
        <p class="fs-5 text-center">
            <strong>Puntaje General:</strong>
            <span th:text="${examen.total}"></span>
        </p>

        <div class="text-center mt-4">
            <a href="/alumno/panel" class="btn btn-secondary px-4 py-2">
                ⬅ Volver al Panel
            </a>
        </div>

    </div>

</div>

</body>
</html>
