<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Coordinador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #0d6efd;
            border: 2px solid black;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: 2px solid black;
            color: white;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: black;
        }
        .btn-outline-light {
            color: white;
            border: 2px solid white;
        }
        .btn-outline-light:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        .form-label {
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">
            <span th:text="${coordinador.id == null} ? 'Nuevo Coordinador' : 'Editar Coordinador'"></span>
        </span>
        <div class="d-flex">
            <a href="/admin/coordinadores" class="btn btn-outline-light">Volver</a>
        </div>
    </div>
</nav>

<!-- FORMULARIO -->
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <form action="/admin/coordinadores/guardar" method="post" th:object="${coordinador}">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label">Documento</label>
                        <input type="text" class="form-control" th:field="*{numdoc}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Primer Nombre</label>
                        <input type="text" class="form-control" th:field="*{pnomb}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Primer Apellido</label>
                        <input type="text" class="form-control" th:field="*{papellido}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" th:field="*{correo}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
