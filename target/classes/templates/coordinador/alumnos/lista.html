<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar, h2 {
            font-weight: bold;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .table thead th {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border: 1px solid black;
        }
        .table td,
        .table th {
            border: 1px solid black;
        }
        .btn-primary-style {
            background-color: #0d6efd;
            color: white;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-primary-style:hover {
            background-color: #0b5ed7;
            border-color: black;
        }
        .btn-outline-style {
            color: #0d6efd;
            background-color: white;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-outline-style:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Lista de Alumnos</h2>
        <a href="/coordinador/alumnos/nuevo" class="btn btn-primary-style">
            ➕ Nuevo Alumno
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo Doc</th>
                            <th>Documento</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${alumnos}">
                            <td th:text="${a.id}"></td>
                            <td th:text="${a.tdoc}"></td>
                            <td th:text="${a.numdoc}"></td>
                            <td th:text="${a.pnomb} + ' ' + ${a.snomb}"></td>
                            <td th:text="${a.papellido} + ' ' + ${a.sapellido}"></td>
                            <td th:text="${a.correo}"></td>
                            <td th:text="${a.telefono}"></td>
                            <td th:text="${a.registro}"></td>
                            <td>
                                <a class="btn btn-primary-style btn-sm"
                                   th:href="@{'/coordinador/alumnos/editar/' + ${a.id}}">
                                    Editar
                                </a>
                                <a class="btn btn-primary-style btn-sm"
                                   th:href="@{'/coordinador/alumnos/eliminar/' + ${a.id}}"
                                   onclick="return confirm('¿Eliminar alumno?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/coordinador/panel" class="btn btn-outline-style w-100">
            ⬅ Volver al panel
        </a>
    </div>

</div>

</body>
</html>
