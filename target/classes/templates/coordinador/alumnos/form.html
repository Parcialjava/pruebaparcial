<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
        }
        .form-label {
            font-weight: bold;
            color: #333;
        }
        .btn-primary-style {
            background-color: #0d6efd;
            color: white;
            border: 2px solid black;
            font-weight: bold;
            padding: 0.6rem;
        }
        .btn-primary-style:hover {
            background-color: #0b5ed7;
            border-color: black;
        }
        .btn-outline-style {
            color: #0d6efd;
            background-color: white;
            border: 2px solid black;
            font-weight: bold;
        }
        .btn-outline-style:hover {
            background-color: #f0f0f0;
        }
        .card h2 {
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card p-4" style="max-width: 650px; margin: auto;">

        <h2 class="text-center mb-4" th:text="${alumno.id == null} ? 'Nuevo Alumno' : 'Editar Alumno'"></h2>

        <form action="/coordinador/alumnos/guardar" method="post" th:object="${alumno}">
            <input type="hidden" th:field="*{id}" />

            <!-- FILA 1 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Tipo Documento</label>
                    <input type="text" class="form-control" th:field="*{tdoc}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Documento</label>
                    <input type="text" class="form-control" th:field="*{numdoc}" required>
                </div>
            </div>

            <!-- FILA 2 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Primer Nombre</label>
                    <input type="text" class="form-control" th:field="*{pnomb}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Segundo Nombre</label>
                    <input type="text" class="form-control" th:field="*{snomb}">
                </div>
            </div>

            <!-- FILA 3 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Primer Apellido</label>
                    <input type="text" class="form-control" th:field="*{papellido}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Segundo Apellido</label>
                    <input type="text" class="form-control" th:field="*{sapellido}">
                </div>
            </div>

            <!-- FILA 4 -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Correo</label>
                    <input type="email" class="form-control" th:field="*{correo}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control" th:field="*{telefono}">
                </div>
            </div>

            <!-- FILA 5 -->
            <div class="mb-3">
                <label class="form-label">Registro</label>
                <input type="text" class="form-control" th:field="*{registro}" required>
            </div>

            <!-- CONTRASEÑA -->
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" th:field="*{password}" required>
            </div>

            <!-- BOTÓN GUARDAR -->
            <button type="submit" class="btn btn-primary-style w-100">Guardar</button>
        </form>

        <!-- VOLVER -->
        <div class="text-center mt-3">
            <a href="/coordinador/alumnos" class="btn btn-outline-style w-100">⬅ Volver</a>
        </div>

    </div>
</div>

</body>
</html>
