<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Único</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
            padding: 1.5rem !important;
        }
        h2, h4 {
            font-weight: bold;
        }
        .info-row {
            margin-bottom: 0.6rem;
        }
        .info-label {
            font-weight: bold;
            display: inline-block;
            min-width: 120px;
        }
        .btn-outline-style {
            color: #0d6efd;
            background-color: white;
            border: 2px solid black;
            font-weight: bold;
            padding: 0.5rem 1rem;
        }
        .btn-outline-style:hover {
            background-color: #f0f0f0;
            text-decoration: none;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card">

        <h2 class="text-center mb-4">Informe Único del Estudiante</h2>

        <!-- Datos del alumno -->
        <h4>Datos del Alumno</h4>

        <p class="info-row">
            <span class="info-label">Nombre:</span>
            <span th:text="${alumno.pnomb + ' ' + alumno.snomb + ' ' + alumno.papellido + ' ' + alumno.sapellido}"></span>
        </p>

        <p class="info-row">
            <span class="info-label">Documento:</span>
            <span th:text="${alumno.numdoc}"></span>
        </p>

        <p class="info-row">
            <span class="info-label">Teléfono:</span>
            <span th:text="${alumno.telefono}"></span>
        </p>

        <p class="info-row">
            <span class="info-label">Correo:</span>
            <span th:text="${alumno.correo}"></span>
        </p>

        <p class="info-row">
            <span class="info-label">Registro:</span>
            <span th:text="${alumno.registro}"></span>
        </p>

        <!-- Puntaje general -->
        <h4 class="mt-3">Puntaje General</h4>
        <p class="info-row">
            <span class="info-label">Total:</span>
            <span th:text="${examen.total}"></span>
        </p>

        <!-- Botón volver -->
        <div class="text-center mt-4">
            <a href="/coordinador/examenes" class="btn btn-outline-style">⬅ Volver</a>
        </div>

    </div>
</div>

</body>
</html>
