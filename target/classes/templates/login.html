<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login SaberPRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
        }
        .login-card {
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .login-card h3 {
            font-weight: 600;
            color: #333;
        }
        .form-control:focus {
            border-color: #4d79f6;
            box-shadow: 0 0 0 0.25rem rgba(77, 121, 246, 0.25);
        }
        .btn-primary {
            background-color: #4d79f6;
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #3a64e0;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card login-card p-4" style="width: 360px;">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>
    <form method="post" action="/login">
        <div class="mb-3">
            <input type="text" name="numdoc" class="form-control" placeholder="Documento" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        <p th:if="${error}" class="text-danger text-center mt-3 mb-0" th:text="${error}"></p>
    </form>
</div>

</body>
</html>
